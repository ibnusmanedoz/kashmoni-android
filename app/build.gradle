plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.kashmoni.app'
    compileSdk 34

    defaultConfig {
        applicationId "ai.kashmoni.app"
        minSdk 29          // Android 10+
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    // Fixed signing key so new builds install as updates (keeps your chats and settings)
    signingConfigs {
        kashmoni {
            storeFile file("kashmoni.keystore")
            storePassword "kashmoni"
            keyAlias "kashmoni"
            keyPassword "kashmoni"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.kashmoni
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.kashmoni
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
