plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.kashmoni.app'
    compileSdk 34

    defaultConfig {
        applicationId "ai.kashmoni.app"
        minSdk 29          // Android 10+
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
